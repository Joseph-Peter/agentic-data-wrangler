[project]
name = "data-wrangling-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "black>=26.5.1",
    "django>=5.2",
    "groq>=0.4.1,<1",
    "langchain>=1.3.15",
    "langchain-groq>=0.3.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pip>=26.2.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
data-wrangling-agent = "data_wrangling_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
